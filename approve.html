<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purity Tracker — Accountability Partner Approval</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #060b16 0%, #0f172a 55%, #1e1b4b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 22px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .icon { font-size: 46px; margin-bottom: 12px; }
    h1 { font-size: 21px; margin: 0 0 10px; color: #38bdf8; }
    p { font-size: 14.5px; line-height: 1.6; color: #cbd5e1; margin: 0 0 18px; }
    .pin-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      text-align: left;
    }
    .pin-form label {
      font-size: 12.5px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: -6px;
    }
    .pin-form input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: #060b16;
      color: #f8fafc;
      font-size: 16px;
      letter-spacing: 3px;
      outline: none;
    }
    .pin-form input:focus {
      border-color: #38bdf8;
    }
    .btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    button {
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-approve { background: #10b981; color: #061018; }
    .btn-deny { background: #ef4444; color: #ffffff; }
    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      display: none;
    }
    .status.ok { display: block; background: rgba(16, 185, 129, 0.16); border: 1px solid #10b981; color: #34d399; }
    .status.err { display: block; background: rgba(239, 68, 68, 0.16); border: 1px solid #ef4444; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1 id="titleText">Accountability Partner Decision</h1>
    <p id="desc">
      Verifying approval link...
    </p>

    <div class="pin-form" id="pinResetForm">
      <label for="newPinInput">New PIN (4–6 digits)</label>
      <input
        type="password"
        id="newPinInput"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        placeholder="Enter 4–6 digit PIN"
        autocomplete="off"
      />
      <label for="confirmPinInput">Confirm PIN</label>
      <input
        type="password"
        id="confirmPinInput"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        placeholder="Re-enter PIN"
        autocomplete="off"
      />
      <div class="btn-row">
        <button class="btn-approve" id="submitPinBtn" onclick="submitPartnerPin()" disabled>Submit</button>
        <button class="btn-deny" id="denyPinBtn" onclick="submitDecision('denied')" disabled>Deny</button>
      </div>
    </div>

    <div class="btn-row" id="actions">
      <button class="btn-approve" id="approveBtn" onclick="submitDecision('approved')" disabled>Approve</button>
      <button class="btn-deny" id="denyBtn" onclick="submitDecision('denied')" disabled>Deny</button>
    </div>
    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = (params.get("req") || "").trim();
    const token = (params.get("token") || "").trim();
    const PROJECT_ID = "purity-tracker-f4d76";

    const titleEl = document.getElementById("titleText");
    const descEl = document.getElementById("desc");
    const statusBox = document.getElementById("statusBox");
    const actionsRow = document.getElementById("actions");
    const approveBtn = document.getElementById("approveBtn");
    const denyBtn = document.getElementById("denyBtn");
    const pinResetForm = document.getElementById("pinResetForm");
    const newPinInput = document.getElementById("newPinInput");
    const confirmPinInput = document.getElementById("confirmPinInput");
    const submitPinBtn = document.getElementById("submitPinBtn");
    const denyPinBtn = document.getElementById("denyPinBtn");

    let currentRequestType = "disable_blocker";

    function showInvalidLink() {
      approveBtn.disabled = true;
      denyBtn.disabled = true;
      submitPinBtn.disabled = true;
      denyPinBtn.disabled = true;
      pinResetForm.style.display = "none";
      actionsRow.style.display = "none";
      titleEl.textContent = "Invalid or Expired Link";
      descEl.textContent = "This approval link cannot be used.";
      statusBox.className = "status err";
      statusBox.textContent = "Invalid or expired approval link";
    }

    async function computeSaltedPinHash(saltToken, pinDigits) {
      const payload = String(saltToken).trim() + ":" + String(pinDigits).trim();
      const bytes = new TextEncoder().encode(payload);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const arr = Array.from(new Uint8Array(digest));
      return arr.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function verifyLinkOnLoad() {
      if (!reqId || !token) {
        showInvalidLink();
        return;
      }

      try {
        const docUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/blocker_disable_requests/${encodeURIComponent(reqId)}`;
        const getResp = await fetch(docUrl);
        if (!getResp.ok) {
          showInvalidLink();
          return;
        }

        const existing = await getResp.json();
        const savedToken = existing?.fields?.token?.stringValue || "";
        const existingStatus = existing?.fields?.status?.stringValue || "pending";
        if (!savedToken || savedToken !== token || existingStatus !== "pending") {
          showInvalidLink();
          return;
        }

        currentRequestType = existing?.fields?.requestType?.stringValue || params.get("type") || "disable_blocker";
        const userName = existing?.fields?.userName?.stringValue || "Your partner";

        if (currentRequestType === "pin_reset" || currentRequestType === "reset_pin") {
          titleEl.textContent = "Set a new PIN for the user";
          descEl.innerHTML = `<strong>${userName}</strong> requested a PIN reset in Purity Tracker.<br/>Set a new 4–6 digit PIN for them below, then share it with them only when appropriate:`;
          actionsRow.style.display = "none";
          pinResetForm.style.display = "flex";
          submitPinBtn.disabled = false;
          denyPinBtn.disabled = false;
        } else if (currentRequestType === "change_partner") {
          descEl.innerHTML = `<strong>${userName}</strong> requested to <strong>change or remove</strong> their Accountability Partner email in Purity Tracker.<br/><br/>Choose whether to approve or deny their request below:`;
          approveBtn.textContent = "Approve Partner Change";
          denyBtn.textContent = "Deny (Keep Locked)";
          approveBtn.disabled = false;
          denyBtn.disabled = false;
        } else {
          descEl.innerHTML = `<strong>${userName}</strong> requested to turn <strong>OFF</strong> the <strong>Block adult content</strong> switch in Purity Tracker.<br/><br/>Choose whether to approve or deny their request below:`;
          approveBtn.textContent = "Approve Turn OFF";
          denyBtn.textContent = "Deny (Keep Blocker ON)";
          approveBtn.disabled = false;
          denyBtn.disabled = false;
        }
      } catch (e) {
        showInvalidLink();
      }
    }

    async function submitPartnerPin() {
      if (!reqId || !token) {
        showInvalidLink();
        return;
      }

      const rawPin = (newPinInput.value || "").trim();
      const rawConfirm = (confirmPinInput.value || "").trim();

      if (!/^\d{4,6}$/.test(rawPin)) {
        statusBox.className = "status err";
        statusBox.textContent = "New PIN must be 4 to 6 digits (numbers only).";
        return;
      }

      if (rawPin !== rawConfirm) {
        statusBox.className = "status err";
        statusBox.textContent = "New PIN and Confirm PIN do not match.";
        return;
      }

      submitPinBtn.disabled = true;
      denyPinBtn.disabled = true;
      statusBox.className = "status ok";
      statusBox.textContent = "Verifying and setting new PIN...";

      try {
        const docUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/blocker_disable_requests/${encodeURIComponent(reqId)}`;

        const getResp = await fetch(docUrl);
        if (!getResp.ok) {
          showInvalidLink();
          return;
        }

        const existing = await getResp.json();
        const savedToken = existing?.fields?.token?.stringValue || "";
        const existingStatus = existing?.fields?.status?.stringValue || "pending";
        if (!savedToken || savedToken !== token || existingStatus !== "pending") {
          showInvalidLink();
          return;
        }

        // Hash the new PIN with SHA-256 using the one-time request token as salt (never send plain text PIN)
        const pinHash = await computeSaltedPinHash(token, rawPin);
        newPinInput.value = "";
        confirmPinInput.value = "";

        const patchUrl = `${docUrl}?updateMask.fieldPaths=status&updateMask.fieldPaths=decidedAt&updateMask.fieldPaths=approvedByToken&updateMask.fieldPaths=pinHash`;
        const body = {
          fields: {
            status: { stringValue: "approved" },
            decidedAt: { integerValue: String(Date.now()) },
            approvedByToken: { stringValue: token },
            pinHash: { stringValue: pinHash }
          }
        };

        const resp = await fetch(patchUrl, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (!resp.ok) {
          showInvalidLink();
          return;
        }

        pinResetForm.style.display = "none";
        statusBox.className = "status ok";
        statusBox.textContent = "New PIN has been set and applied to their device.";
      } catch (err) {
        showInvalidLink();
      }
    }

    async function submitDecision(newStatus) {
      if (!reqId || !token) {
        showInvalidLink();
        return;
      }

      approveBtn.disabled = true;
      denyBtn.disabled = true;
      submitPinBtn.disabled = true;
      denyPinBtn.disabled = true;
      statusBox.className = "status ok";
      statusBox.textContent = "Verifying and submitting your decision...";

      try {
        const docUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/blocker_disable_requests/${encodeURIComponent(reqId)}`;

        // 1. Always GET the request document first; if GET fails OR token mismatches, NEVER PATCH
        const getResp = await fetch(docUrl);
        if (!getResp.ok) {
          showInvalidLink();
          return;
        }

        const existing = await getResp.json();
        const savedToken = existing?.fields?.token?.stringValue || "";
        const existingStatus = existing?.fields?.status?.stringValue || "pending";
        if (!savedToken || savedToken !== token || existingStatus !== "pending") {
          showInvalidLink();
          return;
        }

        currentRequestType = existing?.fields?.requestType?.stringValue || currentRequestType;

        // 2. Include approvedByToken from URL in the PATCH body (field `approvedByToken`)
        const patchUrl = `${docUrl}?updateMask.fieldPaths=status&updateMask.fieldPaths=decidedAt&updateMask.fieldPaths=approvedByToken`;
        const body = {
          fields: {
            status: { stringValue: newStatus },
            decidedAt: { integerValue: String(Date.now()) },
            approvedByToken: { stringValue: token }
          }
        };

        const resp = await fetch(patchUrl, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (!resp.ok) {
          showInvalidLink();
          return;
        }

        pinResetForm.style.display = "none";
        if (newStatus === "approved") {
          statusBox.className = "status ok";
          statusBox.textContent = currentRequestType === "change_partner"
            ? "Approved! Their Accountability Partner email field has been unlocked."
            : "Approved! The Adult Content Blocker on their phone will now turn OFF automatically.";
        } else {
          statusBox.className = "status err";
          statusBox.textContent = currentRequestType === "change_partner"
            ? "Denied! Their Accountability Partner email will remain locked."
            : (currentRequestType === "pin_reset" || currentRequestType === "reset_pin")
            ? "Denied! Their App Security PIN will remain unchanged."
            : "Denied! The Adult Content Blocker will remain ON.";
        }
      } catch (err) {
        showInvalidLink();
      }
    }

    verifyLinkOnLoad();
  </script>
</body>
</html>
